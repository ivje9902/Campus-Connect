<!DOCTYPE html>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<html>
<head>
<title>Login</title>
</head>
<style>
    h1, p {
        text-align: center;
    }
    form  {
        display: table;
        margin-left: auto;
        margin-right: auto;
    }
    label {
        display: table-row;
    }
    input {
        display: table-row;
        padding: 6px 20px;
        margin: 2px;
        box-sizing: border-box;
    }
    .btn {
        padding: 5px;
        width: 40px;
        font-size: 20px;
    }
    
</style>
<body>
<button class="btn" onclick="location.href='frame1.html';"><i class="fa fa-home"></i></button>

<h1>Campus Connect</h1>
<p>Create a new account or log in with an existing one.</p>

<form action="">
    <label for="fname">Email</label>
    <input type="text" id="fname" name="fname"><br><br>
    <label for="fpassword">Password</label>
    <input type="password" id="fpassword" name="fpassword"><br><br>
    <nav>
        <input type="submit" value="Login">
        <input type="button" value="Google login">
    </nav>
</form>

</body>
</html>
